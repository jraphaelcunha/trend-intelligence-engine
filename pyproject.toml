[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "BLE",
]
ignore = [
    "E501", # Line length handled by formatter / prompt text
    "E402", # Module level import not at top (runtime sys.path / sys.stdout setup)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v"
testpaths = ["tests"]
pythonpath = ["."]
