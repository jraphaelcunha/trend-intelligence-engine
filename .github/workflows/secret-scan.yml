name: Secret Leak Prevention

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: Gitleaks - current changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository for commit-range scanning
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan new commits with default and project-specific rules
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
